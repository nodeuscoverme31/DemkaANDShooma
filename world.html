<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вселенная двух душ</title><style>
*{box-sizing:border-box}body{margin:0;background:#070916;color:#e8e1fa;font:15px system-ui,sans-serif}#space{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}header{position:fixed;top:0;left:0;right:0;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(#080a1be0,transparent);pointer-events:none}header>*{pointer-events:auto}h1{font:30px Georgia;margin:0}small{color:#b9accd}button,a{font:inherit;color:#eee2ff;background:#19182ddd;border:1px solid #77649b;border-radius:12px;padding:10px 14px;text-decoration:none;cursor:pointer}button:hover,a:hover{background:#42325d}#panel{position:fixed;right:20px;top:105px;width:min(340px,calc(100% - 40px));padding:22px;background:#111426e8;border:1px solid #60547c;border-radius:20px;backdrop-filter:blur(12px);max-height:65vh;overflow:auto}#panel h2{font:25px Georgia;margin:0 0 14px}#panel p{line-height:1.6;color:#c9bedc}#panel button{margin:4px}#dock{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:min(780px,95vw)}#hint{position:fixed;left:24px;bottom:95px;color:#c2b4da;font-size:12px;pointer-events:none}#status{position:fixed;left:24px;top:85px;color:#c2b4da;font-size:13px}#fallback{position:fixed;inset:20%;padding:24px;background:#17172c;display:none}@media(max-width:650px){header{padding:12px}h1{font-size:22px}#panel{top:auto;bottom:115px;right:12px;width:calc(100% - 24px);max-height:42vh;padding:14px}#dock{bottom:10px}#dock button{font-size:12px;padding:8px}#hint{display:none}#status{top:75px;left:12px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="space"></div><header><div><h1>Вселенная двух душ</h1><small>Ваше пространство открытий</small></div><div><button id="audio">Звук: выкл.</button> <a href="soul.html?edit=1">Профиль</a></div></header><div id="status" role="status">Загрузка пространства…</div><aside id="panel" hidden><button id="close" style="float:right">×</button><h2 id="title"></h2><div id="body"></div></aside><div id="hint">Перетаскивай пространство · колесо или щипок — масштаб · нажми на планету</div><nav id="dock"></nav><div id="fallback">Не удалось запустить космический движок. Проверь WebGL и интернет. <a href="soul.html?edit=1">Профиль</a></div><script type="module">
import * as T from "three";import {OrbitControls} from "three/addons/controls/OrbitControls.js";import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";
const $=id=>document.getElementById(id),db=createClient("https://yqvujabqaivylggcmnos.supabase.co","sb_publishable_D3jgTzuu8iSOBKcXh5U7Jg_x6k2wWLy");const auth=await db.auth.getUser();if(!auth.data.user){location.replace("soul.html");throw Error("login required")}const p=await db.from("souls").select("display_name,profile_data,onboarding_completed").eq("id",auth.data.user.id).single();if(p.error){$("status").textContent=p.error.message;throw Error(p.error.message)}if(!p.data.onboarding_completed){location.replace("soul.html");throw Error("onboarding required")}const profile=p.data.profile_data||{};$("status").textContent="Личная орбита · "+p.data.display_name+" · общая синхронизация ещё не подключена";
let renderer;try{renderer=new T.WebGLRenderer({antialias:true,alpha:false})}catch(e){$("fallback").style.display="block";throw e}renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);$("space").append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color(0x070916);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,1800);camera.position.set(0,0,105);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=12;controls.maxDistance=250;controls.enablePan=true;controls.minAzimuthAngle=-.65;controls.maxAzimuthAngle=.65;controls.minPolarAngle=.85;controls.maxPolarAngle=2.2;
function glowTexture(){const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d"),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,"rgba(255,255,255,1)");g.addColorStop(.18,"rgba(255,255,255,.8)");g.addColorStop(.5,"rgba(255,255,255,.12)");g.addColorStop(1,"rgba(255,255,255,0)");x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c)}const tex=glowTexture();function glow(color,size){const s=new T.Sprite(new T.SpriteMaterial({map:tex,color,transparent:true,blending:T.AdditiveBlending,depthWrite:false}));s.scale.set(size,size,1);return s}
let seed=719;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}const starGeo=new T.BufferGeometry(),pos=[],cols=[];for(let i=0;i<6500;i++){let r=100+rnd()*500,a=rnd()*Math.PI*2,z=rnd()*2-1,h=Math.sqrt(1-z*z);pos.push(r*h*Math.cos(a),r*z,r*h*Math.sin(a));let c=new T.Color().setHSL(.55+rnd()*.2,.35,.45+rnd()*.5);cols.push(c.r,c.g,c.b)}starGeo.setAttribute("position",new T.Float32BufferAttribute(pos,3));starGeo.setAttribute("color",new T.Float32BufferAttribute(cols,3));scene.add(new T.Points(starGeo,new T.PointsMaterial({size:1.2,map:tex,transparent:true,vertexColors:true,depthWrite:false,blending:T.AdditiveBlending})));
const clouds=new T.Group();for(let i=0;i<65;i++){let s=glow(i%2?0x6d39ac:0x294da5,45+rnd()*100);s.material.opacity=.06+rnd()*.09;s.position.set((rnd()-.5)*180,(rnd()-.5)*100,-30-rnd()*90);clouds.add(s)}scene.add(clouds);
const targets=[],animated=[];function orb(x,y,z,color,size,title,desc){let g=new T.Group();g.position.set(x,y,z);let core=new T.Mesh(new T.SphereGeometry(size,32,24),new T.MeshBasicMaterial({color}));g.add(core,glow(color,size*9));let ring=new T.Mesh(new T.TorusGeometry(size*2.1,.055,8,100),new T.MeshBasicMaterial({color,transparent:true,opacity:.5}));ring.rotation.x=1;g.add(ring);scene.add(g);core.userData={title,desc,group:g};targets.push(core);animated.push({g,ring,base:y});return g}
const art=new T.TextureLoader().load("universe.png",()=>{},undefined,()=>{$("status").textContent="Не удалось загрузить художественный слой"});art.colorSpace=T.SRGBColorSpace;
const artwork=new T.Mesh(new T.PlaneGeometry(164.8,92.8),new T.MeshBasicMaterial({map:art,side:T.DoubleSide}));artwork.position.set(0,0,-12);scene.add(artwork);
function soul(x,color,title,desc){const g=new T.Group();g.position.set(x,0,-10);scene.add(g);const hit=new T.Mesh(new T.PlaneGeometry(26,75),new T.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,side:T.DoubleSide}));g.add(hit);hit.userData={title,desc,group:g};targets.push(hit);return g}
const own=soul(49,0x83caff,"Голубая душа","Символический образ. Общий доступ к профилям пока не настроен.");const other=soul(-49,0xffcb80,"Золотая душа","Символический образ. Общий доступ к профилям пока не настроен.");
const streams=new T.Group();scene.add(streams);const motes=[];for(let j=0;j<110;j++){const m=glow(j%2?0xffc57f:0x9ccaff,.6+rnd()*1.4);m.material.opacity=.45;streams.add(m);motes.push({m,phase:rnd(),side:j%2?1:-1})}
const items=[["Исследования",0,27,-6,0xbba0ff,"Открывайте новые стороны личности. Доступна первоначальная анкета."],["Приключения",0,-26,-6,0x75e3c2,"Идеи для совместного опыта: прогулка в новом месте, вечер вопросов, совместное изучение темы."],["Понимание",24,14,-6,0xf3a6d7,"Будущее пространство добровольного обсуждения. ИИ-медиатор ещё не подключён."],["Познание",-24,14,-6,0x85a9ff,"Выбирайте темы для совместного изучения."],["История",0,-4,-6,0xffd080,"Здесь будут появляться совместные воспоминания. Общее хранилище пока не подключено."]];
const dock=$("dock");let flight=null;function focus(g){const dest=g.position.clone();flight={from:controls.target.clone(),to:dest,cam:camera.position.clone(),end:dest.clone().add(new T.Vector3(0,10,38)),start:performance.now()}}
function show(d){$("panel").hidden=false;$("title").textContent=d.title;const b=$("body");b.replaceChildren();const t=document.createElement("p");t.textContent=d.desc;b.append(t);if(d.title==="Исследования"){let a=document.createElement("a");a.href="index.html";a.textContent="Открыть анкету";b.append(a)}if(d.title==="Приключения"||d.title==="Познание"){const opts=profile.interests?.choices||[];const q=document.createElement("p");q.textContent=opts.length?"Твои отмеченные интересы: "+opts.join(", ")+". Общие интересы пока не определены.":"Общие интересы пока не определены.";b.append(q)}focus(d.group)}
for(const [title,x,y,z,c,desc] of items){const g=orb(x,y,z,c,1.2,title,desc);const b=document.createElement("button");b.textContent=title;b.onclick=()=>show(targets.find(t=>t.userData.group===g).userData);dock.append(b)}
const reset=document.createElement("button");reset.textContent="Общий вид";reset.onclick=()=>{flight={from:controls.target.clone(),to:new T.Vector3(),cam:camera.position.clone(),end:new T.Vector3(0,0,105),start:performance.now()};$("panel").hidden=true};dock.append(reset);$("close").onclick=()=>$("panel").hidden=true;
let down;renderer.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>7)return;const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),camera);const hit=ray.intersectObjects(targets)[0];if(hit)show(hit.object.userData)});
let audio=null;$("audio").onclick=async()=>{if(audio){await audio.close();audio=null;$("audio").textContent="Звук: выкл.";return}try{audio=new AudioContext();await audio.resume();const gain=audio.createGain();gain.gain.value=.025;gain.connect(audio.destination);for(const hz of [110,164.81,220,329.63]){let o=audio.createOscillator();o.type="sine";o.frequency.value=hz;o.connect(gain);o.start()}$("audio").textContent="Звук: вкл."}catch(e){$("audio").textContent="Звук недоступен"}};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{const t=performance.now()/1000;clouds.rotation.z=t*.003;motes.forEach(({m,phase,side})=>{const u=(phase+t*.045)%1;const r=44*(1-u);const a=u*Math.PI*2.1+(side===1?0:Math.PI);m.position.set(r*Math.cos(a),r*.48*Math.sin(a)+3,-8);m.material.opacity=Math.sin(Math.PI*u)*.65});animated.forEach((a,i)=>{a.g.position.y=a.base+Math.sin(t*.7+i)*.45;a.ring.rotation.z=t*.25+i});if(flight){let k=Math.min(1,(performance.now()-flight.start)/1200);k=k*k*(3-2*k);controls.target.lerpVectors(flight.from,flight.to,k);camera.position.lerpVectors(flight.cam,flight.end,k);if(k>=1)flight=null}controls.update();renderer.render(scene,camera)});
