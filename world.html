let down;renderer.domElement.addEventListener("pointerdown",e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener("pointerup",e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>7)return;const ray=new T.Raycaster();ray.setFromCamera(new T.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1),camera);const hit=ray.intersectObjects(targets)[0];if(hit)show(hit.object.userData)});
let audio=null;$("audio").onclick=async()=>{if(audio){await audio.close();audio=null;$("audio").textContent="Звук: выкл.";return}try{audio=new AudioContext();await audio.resume();const gain=audio.createGain();gain.gain.value=.025;gain.connect(audio.destination);for(const hz of [110,164.81,220,329.63]){let o=audio.createOscillator();o.type="sine";o.frequency.value=hz;o.connect(gain);o.start()}$("audio").textContent="Звук: вкл."}catch(e){$("audio").textContent="Звук недоступен"}};
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{const t=performance.now()/1000;clouds.rotation.z=t*.003;motes.forEach(({m,phase,side})=>{const u=(phase+t*.045)%1;const r=44*(1-u);const a=u*Math.PI*2.1+(side===1?0:Math.PI);m.position.set(r*Math.cos(a),r*.48*Math.sin(a)+3,-8);m.material.opacity=Math.sin(Math.PI*u)*.65});animated.forEach((a,i)=>{a.g.position.y=a.base+Math.sin(t*.7+i)*.45;a.ring.rotation.z=t*.25+i});if(flight){let k=Math.min(1,(performance.now()-flight.start)/1200);k=k*k*(3-2*k);controls.target.lerpVectors(flight.from,flight.to,k);camera.position.lerpVectors(flight.cam,flight.end,k);if(k>=1)flight=null}controls.update();renderer.render(scene,camera)});
</script></body></html>
