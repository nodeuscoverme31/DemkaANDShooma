<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Душа — личный профиль</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35234b,#110f1c 75%);color:#eee5f6;font:16px/1.6 system-ui,-apple-system,sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:28px 18px 60px}header{text-align:center;color:#c5b5d7}h1{font:46px Georgia,serif;margin:5px 0}header p{margin:0}svg{display:block;margin:auto}section{background:#211b30;border:1px solid #51405f;border-radius:22px;padding:clamp(18px,4vw,30px);margin:26px 0 18px}h2{font-size:24px;line-height:1.32;margin:14px 0 20px}button,input,textarea{font:inherit}button{cursor:pointer;color:#f6ecff;border:1px solid #715b87;background:#3e3153;border-radius:12px;padding:12px 18px}button.primary{color:#251430;background:#cfb1f1;font-weight:700}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #cba9f2;outline-offset:2px}.option{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid #544264;border-radius:12px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#53416b;border-color:#d4b3fb}.option input{accent-color:#cbb0eb;margin-top:5px}.option span{flex:1}textarea,input[type=text]{width:100%;background:#15121f;border:1px solid #67547c;color:white;border-radius:12px;padding:13px;min-height:48px}textarea{min-height:120px;resize:vertical}nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}nav button{flex:1 1 auto}progress{height:8px;width:100%;accent-color:#cbb0ed}.muted{color:#c3b6d3;font-size:13px}.hint{color:#c6bad4}p{line-height:1.65}small{color:#c9b8df}.pill{display:inline-block;border:1px solid #68527e;border-radius:999px;padding:3px 10px;margin:0 0 12px}.section-note{margin:8px 0 20px;color:#c4b7d2}.privacy{font-size:13px;color:#b6a9c8;line-height:1.6}@media (max-width:420px){h1{font-size:40px}nav button{flex:1 1 42%}}@media print{body{background:white;color:black}section{background:white;color:black;border-color:#bbb}header,nav{display:none}}
 .tile{border:1px solid #67547c;padding:14px;border-radius:14px;margin:10px 0}a{color:#dbc3ff}svg text{font-size:11px;fill:#eee5f6}input[type=file]{max-width:100%}label{display:block;margin:12px 0}input{width:100%;padding:12px;border-radius:10px;background:#15121f;color:white;border:1px solid #67547c}a{color:#dbc3ff}</style><main><header><h1>Две души</h1><p>Личное пространство</p></header><section><form id="login"><h2>Вход во Вселенную</h2><label>Почта<input id="email" type="email" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти</button></form><form id="profile" hidden><h2>Твоя душа</h2><p id="universe"></p><label>Имя<input id="name" required maxlength="100"></label><label>Дата рождения<input id="date" type="date"></label><label>Время рождения<input id="time" type="time"></label><label>Место рождения<input id="place" maxlength="200"></label><button class="primary">Сохранить профиль</button><button type="button" id="logout">Выйти</button></form><p id="status" role="status"></p><a href="world.html">Локальная карта и приключения</a></section><p class="privacy">Профиль хранится в Supabase. Общая синхронизация и доступ второго участника пока не реализованы.</p></main><script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";
const db=createClient("https://yqvujabqaivylggcmnos.supabase.co","sb_publishable_D3jgTzuu8iSOBKcXh5U7Jg_x6k2wWLy");
const $=id=>document.getElementById(id);let uid=null;
function status(t){$("status").textContent=t}
async function load(){const {data,error}=await db.auth.getUser();if(error||!data.user){uid=null;$("login").hidden=false;$("profile").hidden=true;return}uid=data.user.id;const p=await db.from("souls").select("display_name,birth_date,birth_time,birth_place").eq("id",uid).single();if(p.error){status("Профиль недоступен: "+p.error.message);return}const u=await db.from("universes").select("name");$("universe").textContent=u.error?"Вселенная недоступна":u.data.map(x=>x.name).join(", ")||"Вселенная не найдена";$("name").value=p.data.display_name;$("date").value=p.data.birth_date||"";$("time").value=(p.data.birth_time||"").slice(0,5);$("place").value=p.data.birth_place||"";$("login").hidden=true;$("profile").hidden=false;status("Вход выполнен")}
$("login").onsubmit=async e=>{e.preventDefault();status("Выполняется вход…");const r=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("password").value="";if(r.error){status(r.error.message);return}await load()};
$("profile").onsubmit=async e=>{e.preventDefault();if(!uid)return;const r=await db.from("souls").update({display_name:$("name").value.trim(),birth_date:$("date").value||null,birth_time:$("time").value||null,birth_place:$("place").value.trim()||null}).eq("id",uid).select("id").single();status(r.error?"Ошибка: "+r.error.message:"Профиль сохранён")};
$("logout").onclick=async()=>{const r=await db.auth.signOut();if(r.error){status(r.error.message);return}uid=null;$("profile").reset();$("profile").hidden=true;$("login").hidden=false;status("Вы вышли")};await load();
</script></html>
