<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мастерская двух душ</title><style>
*{box-sizing:border-box}body{margin:0;background:#10111d;color:#eee8fa;font:14px system-ui}button,input,textarea,select{font:inherit;color:inherit;background:#24243a;border:1px solid #60547c;border-radius:7px;padding:8px}button{cursor:pointer}a{color:#cbb7ff}header{height:58px;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #39334d}main{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;height:calc(100dvh - 58px)}aside{padding:12px;overflow:auto;background:#191a29}#viewport{position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(#55506b 1px,transparent 1px);background-size:20px 20px}#plane{position:absolute;transform-origin:0 0;width:1px;height:1px}#edges{position:absolute;overflow:visible;pointer-events:none} .node{position:absolute;width:210px;min-height:90px;padding:12px;background:#26243a;border:1px solid #8673ad;border-radius:10px;cursor:grab;user-select:none;overflow-wrap:anywhere}.node.selected{border:2px solid #f3cb80}.node small{display:block;color:#b9abc9;margin-top:8px}#list button{display:block;width:100%;text-align:left;margin:5px 0}#editor input,#editor textarea,#editor select{width:100%;margin:5px 0}textarea{min-height:140px}#notice{font-size:12px;color:#e8c58a}#links button{margin:3px} @media(max-width:850px){main{grid-template-columns:150px minmax(0,1fr);grid-template-rows:60% 40%}#editor{grid-column:1/-1}header{height:auto;flex-wrap:wrap}}
</style><header><a href="world.html">← Вселенная</a><strong>Мастерская</strong><button id="add">+ Идея</button><button id="fit">Обзор</button><button id="reload">Обновить</button><span id="notice" role="status"></span></header><main><aside><strong>Карточки</strong><div id="list"></div></aside><section id="viewport" aria-label="Канвас"><div id="plane"><svg id="edges" width="1" height="1"></svg></div></section><aside id="editor">Выбери карточку для редактирования.</aside></main><script type="module">
import {mountSoulChat} from "./messenger.js";
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/+esm";
const db=createClient("https://yqvujabqaivylggcmnos.supabase.co","sb_publishable_D3jgTzuu8iSOBKcXh5U7Jg_x6k2wWLy"),$=id=>document.getElementById(id),say=t=>$("notice").textContent=t;
const auth=await db.auth.getUser();if(!auth.data.user){location.replace("soul.html");throw Error("login required")}const uid=auth.data.user.id;
const membership=await db.from("memberships").select("universe_id").eq("soul_id",uid).single();if(membership.error){say(membership.error.message);throw Error("membership")}const universeId=membership.data.universe_id;mountSoulChat({db,auth,universeId});
const states={idea:"Идеи",discussion:"Обсудить",verification:"Проверить",done:"Реализовано"};let cards=[],links=[],selected=null,panX=20,panY=20,scale=1,drag=null,linkFrom=null;
const viewport=$("viewport"),plane=$("plane"),edges=$("edges");function transform(){plane.style.transform="translate("+panX+"px,"+panY+"px) scale("+scale+")"}transform();
function drawEdges(){edges.replaceChildren();for(const l of links){const a=cards.find(c=>c.id===l.source_id),b=cards.find(c=>c.id===l.target_id);if(!a||!b)continue;const line=document.createElementNS("http://www.w3.org/2000/svg","line");for(const [k,v] of Object.entries({x1:a.x+105,y1:a.y+45,x2:b.x+105,y2:b.y+45,stroke:"#a794cf","stroke-width":2}))line.setAttribute(k,v);edges.append(line);if(l.label){const t=document.createElementNS("http://www.w3.org/2000/svg","text");t.setAttribute("x",(a.x+b.x)/2+105);t.setAttribute("y",(a.y+b.y)/2+40);t.setAttribute("fill","#e8d9ff");t.textContent=l.label;edges.append(t)}}}
function render(){plane.querySelectorAll(".node").forEach(n=>n.remove());$("list").replaceChildren();for(const c of cards){const n=document.createElement("div");n.className="node"+(selected===c.id?" selected":"");n.style.left=c.x+"px";n.style.top=c.y+"px";const title=document.createElement("strong");title.textContent=c.title;const st=document.createElement("small");st.textContent=states[c.status];n.append(title,st);plane.append(n);n.onpointerdown=e=>{if(e.button!==0)return;e.stopPropagation();n.setPointerCapture(e.pointerId);drag={c,n,x:e.clientX,y:e.clientY,ox:c.x,oy:c.y,moved:false}};n.onpointermove=e=>{if(drag?.n!==n)return;const dx=(e.clientX-drag.x)/scale,dy=(e.clientY-drag.y)/scale;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved)return;c.x=drag.ox+dx;c.y=drag.oy+dy;n.style.left=c.x+"px";n.style.top=c.y+"px";drawEdges()};n.onpointercancel=()=>{if(drag?.n===n){c.x=drag.ox;c.y=drag.oy;drag=null;render()}};n.onpointerup=async()=>{if(drag?.n!==n)return;const d=drag;drag=null;if(!d.moved){await choose(c);return}const r=await db.from("workshop_cards").update({position_x:c.x,position_y:c.y}).eq("id",c.id).select("updated_at").single();if(r.error){c.x=d.ox;c.y=d.oy;render();say(r.error.message)}else{c.updated_at=r.data.updated_at;say("Положение сохранено")}};const btn=document.createElement("button");btn.textContent=c.title;btn.onclick=()=>{panX=viewport.clientWidth/2-(c.x+105)*scale;panY=viewport.clientHeight/2-(c.y+45)*scale;transform();choose(c)};$("list").append(btn)}drawEdges()}
async function load(){const [a,b]=await Promise.all([db.from("workshop_cards").select("*").eq("universe_id",universeId).order("created_at").order("id"),db.from("workshop_links").select("*").eq("universe_id",universeId)]);if(a.error||b.error){say((a.error||b.error).message);return}cards=a.data.map((c,i)=>({...c,x:c.position_x??(i%4)*250,y:c.position_y??Math.floor(i/4)*145}));links=b.data;render();say(cards.length+" карточек");if(selected){const c=cards.find(x=>x.id===selected);if(c)edit(c)}}
async function choose(c){if(linkFrom&&linkFrom!==c.id){const from=linkFrom;linkFrom=null;const label=prompt("Название связи (необязательно)","");if(label===null){say("Связь отменена");return}const r=await db.from("workshop_links").insert({universe_id:universeId,source_id:from,target_id:c.id,label:label.slice(0,200)});if(r.error){say(r.error.message);return}await load()}selected=c.id;render();edit(cards.find(x=>x.id===c.id)||c)}
function edit(c){const ed=$("editor");ed.replaceChildren();const title=document.createElement("input");title.value=c?.title||"";title.placeholder="Название идеи";title.maxLength=250;const desc=document.createElement("textarea");desc.value=c?.description||"";desc.placeholder="Описание, мысли, ТЗ";const st=document.createElement("select");for(const [k,v] of Object.entries(states)){const o=document.createElement("option");o.value=k;o.textContent=v;st.append(o)}st.value=c?.status||"idea";const save=document.createElement("button");save.textContent="Сохранить";ed.append(title,desc,st,save);save.onclick=async()=>{if(!title.value.trim())return;save.disabled=true;try{const values={title:title.value.trim(),description:desc.value,status:st.value};const r=c?await db.from("workshop_cards").update(values).eq("id",c.id).eq("updated_at",c.updated_at).select("id").single():await db.from("workshop_cards").insert({...values,universe_id:universeId,created_by:uid}).select("id").single();if(r.error)throw r.error;selected=r.data.id;await load()}catch(e){say(e.message)}finally{save.disabled=false}};if(c){const link=document.createElement("button");link.textContent="Связать с карточкой";link.onclick=()=>{linkFrom=c.id;say("Выбери вторую карточку")};ed.append(link);const ls=document.createElement("div");ls.id="links";for(const l of links.filter(l=>l.source_id===c.id||l.target_id===c.id)){const del=document.createElement("button");const other=cards.find(x=>x.id===(l.source_id===c.id?l.target_id:l.source_id));del.textContent="× "+(other?.title||"Связь")+(l.label?" · "+l.label:"");del.onclick=async()=>{if(!confirm("Удалить связь?"))return;const r=await db.from("workshop_links").delete().eq("id",l.id);if(r.error)say(r.error.message);else await load()};ls.append(del)}ed.append(ls)}}
let panning=null;viewport.onpointerdown=e=>{if(e.target.closest(".node"))return;viewport.setPointerCapture(e.pointerId);panning={x:e.clientX,y:e.clientY,px:panX,py:panY}};viewport.onpointermove=e=>{if(!panning)return;panX=panning.px+e.clientX-panning.x;panY=panning.py+e.clientY-panning.y;transform()};viewport.onpointerup=viewport.onpointercancel=()=>panning=null;viewport.addEventListener("wheel",e=>{e.preventDefault();const rect=viewport.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;const next=Math.max(.2,Math.min(2.5,scale*Math.exp(-e.deltaY*.001)));panX=x-(x-panX)*next/scale;panY=y-(y-panY)*next/scale;scale=next;transform()},{passive:false});
$("fit").onclick=()=>{if(!cards.length)return;const x=Math.min(...cards.map(c=>c.x)),y=Math.min(...cards.map(c=>c.y)),w=Math.max(...cards.map(c=>c.x+210))-x,h=Math.max(...cards.map(c=>c.y+110))-y;scale=Math.max(.15,Math.min(1,(viewport.clientWidth-40)/w,(viewport.clientHeight-40)/h));panX=20-x*scale;panY=20-y*scale;transform()};$("add").onclick=()=>{selected=null;edit(null)};$("reload").onclick=load;await load();$("fit").click();
</script></html>
