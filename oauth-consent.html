<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Доступ к Мастерской</title><style>body{background:#101426;color:#eee6fa;font:16px system-ui;max-width:520px;margin:10vh auto;padding:24px}button,input{font:inherit;padding:12px;margin:6px;border-radius:10px;border:1px solid #81709e;background:#26223b;color:white}input{display:block;width:90%}button:disabled{opacity:.5}</style><h1>Доступ к Мастерской</h1><p id="status">Проверка запроса…</p><form id="login" hidden><input type="email" id="email" placeholder="Почта" required><input type="password" id="password" placeholder="Пароль" required><button>Войти</button></form><section id="consent" hidden><p>ChatGPT запрашивает доступ к общим карточкам и связям Мастерской. Разрешение включает чтение и изменение данных. Не предоставляй доступ, если не инициировал подключение самостоятельно.</p><button id="approve">Разрешить</button><button id="deny">Отклонить</button></section><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
const db=createClient("https://yqvujabqaivylggcmnos.supabase.co","sb_publishable_D3jgTzuu8iSOBKcXh5U7Jg_x6k2wWLy"),$=id=>document.getElementById(id),id=new URLSearchParams(location.search).get("authorization_id"),clientId="fb923c9b-b2fb-4172-a1f5-6f49c13bd3e2";const say=t=>$("status").textContent=t;
async function start(){if(!id){say("Отсутствует идентификатор авторизации");return}const u=await db.auth.getUser();if(!u.data.user){$("login").hidden=false;say("Войди в свой аккаунт Вселенной");return}const r=await db.auth.oauth.getAuthorizationDetails(id);if(r.error){say(r.error.message);return}if(r.data.client?.id!==clientId){say("Не удалось подтвердить идентификатор клиента. Доступ не выдан.");return}$("login").hidden=true;$("consent").hidden=false;say("Запрос доступа: "+(r.data.client.name||"Мастерская"))}
$("login").onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$("email").value,password:$("password").value});$("password").value="";if(r.error)say(r.error.message);else await start()};
async function decide(yes){$("approve").disabled=$("deny").disabled=true;try{const r=await (yes?db.auth.oauth.approveAuthorization(id,{skipBrowserRedirect:true}):db.auth.oauth.denyAuthorization(id,{skipBrowserRedirect:true}));if(r.error)throw r.error;if(!r.data?.redirect_url)throw Error("Нет адреса перенаправления");location.assign(r.data.redirect_url)}catch(e){say(e.message);$("approve").disabled=$("deny").disabled=false}}$("approve").onclick=()=>decide(true);$("deny").onclick=()=>decide(false);start().catch(e=>say(e.message));
</script></html>
